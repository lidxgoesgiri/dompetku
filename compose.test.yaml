services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dompetku_test
      POSTGRES_USER: dompetku_test
      POSTGRES_PASSWORD: test-only-not-production
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [testnet]
  test:
    build:
      context: .
      target: test
    environment:
      NODE_ENV: test
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: dompetku_development
      TEST_DB_NAME: dompetku_test
      DB_USER: dompetku_test
      DB_PASSWORD: test-only-not-production
      JWT_SECRET: test-only-jwt-secret-not-for-production
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:3001
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        'sh',
        '-c',
        'npm run lint && npm run format:check && npm test && npm run db:migrate && npm run test:db',
      ]
    networks: [testnet]
networks:
  testnet:
    internal: true
